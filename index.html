<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#A33B31">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Nunito:wght@400;500;600;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">

    <script type="importmap">
        {
            "imports": {
                "@material/web/": "https://esm.run/@material/web/"
            }
        }
    </script>
    <script type="module">
        import '@material/web/slider/slider.js';
    </script>

    <style>
    
    .chart-scroll-wrapper {
    overflow-x: hidden;
}
.line-chart-card.expanded .chart-scroll-wrapper {
    overflow-x: auto;
}
        :root {
            /* ====== 主色调系列（核心视觉强调色） ====== */
            --md-sys-color-primary: #A33B31;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #FFDAD5;
            --md-sys-color-on-primary-container: #410001;

            /* ====== 次要色调系列 ====== */
            --md-sys-color-secondary: #775652;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #FFDAD5;
            --md-sys-color-on-secondary-container: #2C1512;

            /* ====== 第三色调系列（当前用于第一级警告状态） ====== */
            --md-sys-color-tertiary: #715B2E;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #FDE0A6;
            --md-sys-color-on-tertiary-container: #261900;

            /* ====== 错误/危险色调系列（当前用于最紧急警告状态） ====== */
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #410002;

            /* ====== 表面及背景色调系列（大面积背景和文字） ====== */
            --md-sys-color-surface: #FFF8F6;
            --md-sys-color-on-surface: #231918;
            --md-sys-color-surface-variant: #F5E9E7;
            --md-sys-color-on-surface-variant: #534341;
            
            /* ====== 轮廓线条颜色 ====== */
            --md-sys-color-outline: #857370;
            --md-sys-color-outline-variant: #D8C2BF;

            /* ====== 表面容器色系（区分卡片层级，从低到高颜色逐渐加深/凸起） ====== */
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-surface-container-low: #FFF1EF;
            --md-sys-color-surface-container: #FCEAE8;
            --md-sys-color-surface-container-high: #F6E4E2;
            --md-sys-color-surface-container-highest: #F1DFDD;

            /* ====== 反转表面色（用于黑色对比提示框） ====== */
            --md-sys-color-inverse-surface: #382E2D;
            --md-sys-color-inverse-on-surface: #FFEDEA;

            --md-sys-shape-corner-extra-small: 8px;
            --md-sys-shape-corner-small: 16px;
            --md-sys-shape-corner-medium: 24px;
            --md-sys-shape-corner-large: 32px;
            --md-sys-shape-corner-extra-large: 40px;
            --md-sys-shape-corner-full: 999px;

            --md-sys-elevation-0: 0px 0px 0px rgba(0,0,0,0);
            --md-sys-elevation-1: 0px 4px 8px rgba(163,59,49,0.08), 0px 1px 3px rgba(163,59,49,0.04);
            --md-sys-elevation-2: 0px 6px 12px rgba(163,59,49,0.12), 0px 3px 6px rgba(163,59,49,0.08);
            --md-sys-elevation-3: 0px 8px 16px rgba(163,59,49,0.16), 0px 4px 8px rgba(163,59,49,0.10);
            
            --anim-speed: 1.2s; 
            --md-sys-motion-easing-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1.0);
            --md-sys-motion-easing-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body.dark {
            --md-sys-color-primary: #FFB4AB;
            --md-sys-color-on-primary: #690003;
            --md-sys-color-primary-container: #83241C;
            --md-sys-color-on-primary-container: #FFDAD5;
            --md-sys-color-secondary: #E7BDB7;
            --md-sys-color-on-secondary: #442926;
            --md-sys-color-secondary-container: #5D3F3B;
            --md-sys-color-on-secondary-container: #FFDAD5;
            --md-sys-color-tertiary: #E0C48C;
            --md-sys-color-on-tertiary: #3F2E04;
            --md-sys-color-tertiary-container: #584419;
            --md-sys-color-on-tertiary-container: #FDE0A6;
            --md-sys-color-error: #FFB4AB;
            --md-sys-color-on-error: #690005;
            --md-sys-color-error-container: #93000A;
            --md-sys-color-on-error-container: #FFDAD6;
            --md-sys-color-surface: #1A1110;
            --md-sys-color-on-surface: #F1DFDD;
            --md-sys-color-surface-variant: #534341;
            --md-sys-color-on-surface-variant: #D8C2BF;
            --md-sys-color-outline: #A08C89; 
            --md-sys-color-outline-variant: #534341;
            --md-sys-color-surface-container-lowest: #140C0B;
            --md-sys-color-surface-container-low: #1A1110;
            --md-sys-color-surface-container: #211514; 
            --md-sys-color-surface-container-high: #2B1F1E;
            --md-sys-color-surface-container-highest: #362928;
            --md-sys-color-inverse-surface: #F1DFDD;
            --md-sys-color-inverse-on-surface: #382E2D;

            --md-sys-elevation-1: 0px 4px 8px rgba(0,0,0,0.5), 0px 2px 4px rgba(0,0,0,0.4);
            --md-sys-elevation-2: 0px 6px 12px rgba(0,0,0,0.6), 0px 3px 6px rgba(0,0,0,0.5);
            --md-sys-elevation-3: 0px 8px 16px rgba(0,0,0,0.7), 0px 4px 8px rgba(0,0,0,0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }

        html, body {
            height: 100%; height: 100dvh; width: 100%; overflow: hidden; font-family: 'Nunito', 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
            touch-action: manipulation; -webkit-font-smoothing: antialiased;
            display: flex; justify-content: center; align-items: center;
            transition: background-color 0.4s ease, color 0.4s ease; position: relative;
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 256px 256px; transition: opacity 0.4s ease;
        }
        body.dark .noise-overlay { opacity: 1; }

        .app-container {
            width: 100%; max-width: 440px; height: 100%; max-height: 900px;
            display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 20px;
            position: relative; z-index: 1;
        }

        .top-card {
            background-color: var(--md-sys-color-surface-container-low); border-radius: var(--md-sys-shape-corner-extra-large);
            padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--md-sys-elevation-1); flex-shrink: 0; position: relative; overflow: hidden;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        .top-card-title {
            font-family: 'Zen Old Mincho', serif; font-size: 1.8rem; font-weight: 600;
            color: var(--md-sys-color-on-surface); letter-spacing: 0.02em; line-height: 1.2;
        }
        .top-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 22px; border: none;
            background: var(--md-sys-color-surface-container-highest); cursor: pointer; display: flex;
            align-items: center; justify-content: center; color: var(--md-sys-color-on-surface-variant);
            transition: background-color 0.4s var(--md-sys-motion-easing-emphasized), color 0.4s var(--md-sys-motion-easing-emphasized), transform 0.4s var(--md-sys-motion-easing-emphasized); 
            position: relative; overflow: hidden;
        }
        .icon-btn:active { background: var(--md-sys-color-primary-container); transform: scale(0.9); }
        .icon-btn svg { width: 22px; height: 22px; }

        .mode-cards { 
            display: flex; flex-shrink: 0; position: relative; padding: 6px;
            background-color: var(--md-sys-color-surface-container-high); border-radius: 36px;
            box-shadow: inset 0px 3px 6px rgba(0,0,0,0.06); z-index: 1; transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        body.dark .mode-cards { box-shadow: inset 0px 3px 8px rgba(0,0,0,0.3); }

.mode-indicator {
    position: absolute; top: 6px; bottom: 6px; left: 0; width: 33.33%; border-radius: 30px;
    background-color: var(--md-sys-color-primary-container); box-shadow: var(--md-sys-elevation-1); z-index: 0;
    transition: transform 0.6s var(--md-sys-motion-easing-emphasized), width 0.6s var(--md-sys-motion-easing-emphasized), background-color 0.4s ease;
}

        .mode-card {
            flex: 1; padding: 14px 4px; background: transparent; border: none; font-family: inherit;
            font-size: 0.95rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant); cursor: pointer; 
            text-align: center; letter-spacing: 0.01em; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 6px; position: relative; z-index: 1; transition: color 0.4s ease, transform 0.3s ease;
        }
        .mode-card.active { color: var(--md-sys-color-on-primary-container); }
        .mode-card:active { transform: scale(0.92); }
        .mode-card.disabled { opacity: 0.5; pointer-events: none; }
        .mode-icon { width: 28px; height: 28px; fill: currentColor; opacity: 0.9; transition: opacity 0.4s ease; }
        .mode-card.active .mode-icon { opacity: 1; }

        .timer-card {
            flex: 1; background-color: var(--md-sys-color-surface-container-low); border-radius: var(--md-sys-shape-corner-extra-large); 
            box-shadow: var(--md-sys-elevation-2); display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px 16px; gap: 16px; min-height: 0; position: relative; transition: background-color 0.4s ease; overflow: hidden;
        }

        .progress-container { 
            position: relative; width: min(68vw, 260px); height: min(68vw, 260px); 
            flex-shrink: 0; border-radius: 50%; 
            transition: transform 0.8s var(--md-sys-motion-easing-spring); 
        }
        .progress-container.running { transform: translateY(12px) scale(1.06); }
        
        .progress-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-ring .track { fill: none; stroke: var(--md-sys-color-surface-container-highest); stroke-width: 14; transition: stroke 0.4s ease; }
        .progress-ring .progress {
            fill: none; stroke: var(--md-sys-color-primary); stroke-width: 14; stroke-linecap: round;
            transition: stroke-dashoffset var(--anim-speed) linear, stroke 0.5s ease;
        }
        .progress-ring .progress-tail { fill: none; stroke: url(#tailGradient); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset var(--anim-speed) linear;}
        .progress-ring .progress.warning { stroke: var(--md-sys-color-tertiary); }
        .progress-ring .progress.urgent { stroke: var(--md-sys-color-error); }

        .time-display-wrapper { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            display: flex; flex-direction: column; align-items: center; 
            gap: 16px; 
            pointer-events: auto; z-index: 10;
        }

        .time-display {
            font-size: clamp(3.2rem, 11vw, 4.8rem); 
            font-family: 'Roboto Flex', 'Inter', monospace;
            font-variation-settings: "wght" 700, "wdth" 100;
            color: var(--md-sys-color-on-surface); 
            line-height: 1; font-variant-numeric: tabular-nums; 
            transition: color 0.4s ease, font-variation-settings 0.2s linear, text-decoration 0.3s ease;
        }
        .time-display.warning { color: var(--md-sys-color-tertiary); } 
        .time-display.urgent { color: var(--md-sys-color-error); }
        
        .time-display.editable {
            text-decoration: underline;
            text-decoration-style: dashed;
            text-decoration-color: var(--md-sys-color-outline-variant);
            text-underline-offset: 8px; 
            text-decoration-thickness: 3px;
            cursor: pointer;
            border-radius: 12px;
        }
        .time-display.editable:active { opacity: 0.6; }

        .time-display-input {
            width: 4em; background: transparent; border: none;
            color: var(--md-sys-color-primary); font-family: 'Roboto Flex', 'Inter', monospace;
            font-size: clamp(3.2rem, 11vw, 4.8rem); font-weight: 800; text-align: center;
            outline: none; padding: 0; line-height: 1; letter-spacing: -0.04em;
            border-bottom: 3px dashed var(--md-sys-color-primary);
        }
        
        .time-label {
            font-size: 0.85rem; font-weight: 600; color: var(--md-sys-color-on-surface-variant); pointer-events: none;
            letter-spacing: 0.04em; text-transform: uppercase; background: var(--md-sys-color-surface-container-highest);
            padding: 4px 16px; border-radius: var(--md-sys-shape-corner-full); transition: background 0.4s ease;
        }

        .controls-card {
            background-color: var(--md-sys-color-surface-container-high); border-radius: 36px;
            padding: 8px 12px; display: inline-flex; align-items: center; align-self: center; justify-content: center; gap: 12px; flex-shrink: 0; 
            box-shadow: var(--md-sys-elevation-2); transition: background-color 0.4s ease, box-shadow 0.4s ease, gap 0.6s var(--md-sys-motion-easing-spring), padding 0.6s var(--md-sys-motion-easing-spring);
        }
        .controls-card.running { gap: 24px; padding: 8px 16px; }
        
        .fab-primary {
            width: 80px; height: 80px; border-radius: 40px; border: none;
            background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
            cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--md-sys-elevation-3);
            transition: border-radius 0.6s var(--md-sys-motion-easing-spring), background-color 0.6s cubic-bezier(0.2, 0, 0, 1), transform 0.4s var(--md-sys-motion-easing-spring), box-shadow 0.4s ease;
            position: relative; overflow: hidden; flex-shrink: 0; z-index: 2;
        }
        .fab-primary svg { width: 36px; height: 36px; pointer-events: none; position: relative; z-index: 2; transition: transform 0.4s ease;}
        .fab-primary.running { border-radius: 24px; background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); box-shadow: var(--md-sys-elevation-1); }
        .fab-primary.running svg { transform: scale(0.9); }
        .fab-primary.bounce { animation: fabBounce 0.5s var(--md-sys-motion-easing-spring); }
        @keyframes fabBounce { 0% { transform: scale(1); } 40% { transform: scale(0.85); } 100% { transform: scale(1); } }

        .btn-filled.btn-stateful {
            max-width: 54px; width: 54px; height: 48px; border-radius: 24px; border: none; background: transparent; color: var(--md-sys-color-on-surface-variant);
            cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
            transition: max-width 0.4s var(--md-sys-motion-easing-spring), background-color 0.3s ease, opacity 0.3s ease, transform 0.4s var(--md-sys-motion-easing-spring), margin 0.4s ease; 
            position: relative; overflow: hidden;
        }
        .controls-card:not(.pristine) .btn-idle { max-width: 0; opacity: 0; margin: 0; transform: scale(0) rotate(-45deg); pointer-events: none; }
        .controls-card.pristine .btn-running { max-width: 0; opacity: 0; margin: 0; transform: scale(0) rotate(45deg); pointer-events: none; }
        
        .controls-card.running .btn-filled.btn-stateful { transform: scale(0.85); border-radius: 16px; opacity: 0.6; }
        .btn-filled:active { background: var(--md-sys-color-surface-variant); transform: scale(0.9); }
        .btn-filled svg { width: 22px; height: 22px; }

        .session-card-btn {
            background-color: var(--md-sys-color-surface-container-low); border-radius: 28px; padding: 16px 24px; 
            display: flex; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0; 
            box-shadow: var(--md-sys-elevation-1); border: none; cursor: pointer; color: var(--md-sys-color-on-surface-variant);
            transition: background-color 0.4s ease, color 0.4s ease, transform 0.4s var(--md-sys-motion-easing-spring), border-radius 0.4s var(--md-sys-motion-easing-spring);
            width: 100%; font-family: inherit; position: relative; overflow: hidden;
        }
        .session-card-btn:active { transform: scale(0.96); border-radius: 16px; background-color: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-primary); }
        .session-card-btn svg { width: 22px; height: 22px; }
        .session-card-btn .session-label { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em; }

        .toast {
            position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%) translateY(120px);
            background-color: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
            padding: 14px 28px; border-radius: var(--md-sys-shape-corner-full); font-size: 0.95rem; font-weight: 600;
            letter-spacing: 0.02em; z-index: 100; pointer-events: none; transition: transform 0.6s var(--md-sys-motion-easing-emphasized);
            box-shadow: var(--md-sys-elevation-3); text-align: center; white-space: nowrap; max-width: 85vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .update-snackbar {
            position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%) translateY(150px);
            background-color: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
            padding: 10px 10px 10px 20px; border-radius: var(--md-sys-shape-corner-large); font-size: 0.95rem; font-weight: 600;
            display: flex; align-items: center; gap: 16px; box-shadow: var(--md-sys-elevation-3);
            z-index: 150; transition: transform 0.8s var(--md-sys-motion-easing-spring), opacity 0.6s ease;
            opacity: 0; pointer-events: none; letter-spacing: 0.02em; white-space: nowrap; max-width: 90vw;
        }
        .update-snackbar.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
        .update-snackbar-text { display: flex; align-items: center; gap: 8px; flex: 1; }
        .update-snackbar-icon { display: flex; align-items: center; justify-content: center; color: var(--md-sys-color-inverse-on-surface); animation: rotate-pulse 2s cubic-bezier(0.2, 0, 0, 1) infinite; }
        .update-snackbar-icon svg { width: 18px; height: 18px; }
        .update-btn { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 800; cursor: pointer; transition: transform 0.4s var(--md-sys-motion-easing-spring), background-color 0.3s ease; font-family: inherit; font-size: 0.9rem; letter-spacing: 0.04em; }
        .update-btn:active { transform: scale(0.92); background-color: var(--md-sys-color-on-primary-container); color: var(--md-sys-color-primary-container); }

        @keyframes rotate-pulse { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(196,74,60,0.4); } 50% { box-shadow: 0 0 0 32px rgba(196,74,60,0); } 100% { box-shadow: 0 0 0 0 rgba(196,74,60,0); } }
        .progress-container.completed-anim { animation: pulse-ring 1.5s ease-out; }

        .ripple { position: absolute; border-radius: 50%; background: rgba(var(--md-sys-color-on-primary-container), 0.2); transform: scale(0); animation: ripple-effect 0.6s ease-out; pointer-events: none; z-index: 1; }
        @keyframes ripple-effect { to { transform: scale(4); opacity: 0; } }

        /* ======== 底部设置面板 ======== */
        .settings-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); z-index: 200; opacity: 0; visibility: hidden; 
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            transition: opacity 0.4s ease, visibility 0.4s, backdrop-filter 0.6s ease, -webkit-backdrop-filter 0.6s ease;
        }
        .settings-overlay.active { opacity: 1; visibility: visible; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .bottom-sheet {
            position: fixed; bottom: 0; left: 50%; width: 100%; max-width: 440px;
            background: var(--md-sys-color-surface-container-low); border-radius: 48px 48px 0 0;
            padding: 24px 24px 40px; box-shadow: 0px -8px 24px rgba(0,0,0,0.1);
            transform: translate(-50%, calc(100% + 30px)); 
            transition: transform 0.6s var(--md-sys-motion-easing-emphasized), background-color 0.4s ease, border-radius 0.6s var(--md-sys-motion-easing-emphasized);
            z-index: 201;
        }
        .bottom-sheet.active { transform: translate(-50%, 0); border-radius: 28px 28px 0 0; }
        .sheet-handle { width: 40px; height: 4px; background: var(--md-sys-color-outline-variant); border-radius: 2px; margin: 0 auto 20px; }
        .sheet-title { font-family: 'Zen Old Mincho', serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 24px; color: var(--md-sys-color-on-surface); }
        
        .setting-group { display: flex; flex-direction: column; gap: 24px; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; }
        .setting-label-wrap { display: flex; align-items: center; gap: 12px; }
        .setting-icon { width: 22px; height: 22px; color: var(--md-sys-color-on-surface-variant); opacity: 0.8; }
        .setting-label { font-weight: 600; color: var(--md-sys-color-on-surface-variant); font-size: 0.95rem; }
        
        .lang-segment {

<script>
navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
        document.getElementById('updateSnackbar').classList.add('show');
    }
});
let newWorker;
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
            registration.addEventListener('updatefound', () => {
                newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        document.getElementById('updateSnackbar').classList.add('show');
                    }
                });
            });
        }).catch(err => console.log('SW 注册失败:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            window.location.reload();
            refreshing = true;
        });
    });
}
</script>

            // ======== 核心：动态折线图渲染逻辑 ========
            function renderLineChart() {
                const inner = document.getElementById('chartInner');
                const titleEl = document.getElementById('lineChartTitle');
                if (!inner || !appData.sessionLog) return;
                
                const t = getT();
                const now = new Date();
                let buckets = [];
                let labels = [];
                let highlightIdx = -1;
                let defaultMax = 60; // 默认最大Y轴高度（防止太平）

                // 设置图表标题
                if(currentChartRange === 'today') titleEl.textContent = t.chartTitleToday;
                else if(currentChartRange === 'week') titleEl.textContent = t.chartTitleWeek;
                else if(currentChartRange === 'month') titleEl.textContent = t.chartTitleMonth;

                // 1. 数据桶聚类 (Bucketing)
                if (currentChartRange === 'today') {
                    // 今日：0点到24点 (24个格子)
                    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                    buckets = new Array(24).fill(0);
                    for(let i=0; i<24; i++) labels.push(i.toString());
                    
                    appData.sessionLog.forEach(log => {
                        if (log.mode === 'work' && log.ts >= startOfDay && log.ts < startOfDay + 86400000) {
                            const hr = new Date(log.ts).getHours();
                            buckets[hr] += log.duration / 60; // 转分钟
                        }
                    });
                    highlightIdx = now.getHours();
                    defaultMax = 60; 

                } else if (currentChartRange === 'week') {
                    // 周内：周一到周日 (7个格子)
                    const dayOfWeek = (now.getDay() + 6) % 7; // 转为 周一=0, 周日=6
                    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                    const startOfWeek = startOfDay - (dayOfWeek * 86400000);
                    buckets = new Array(7).fill(0);
                    labels = t.days; // 词典里的周一到周日
                    
                    appData.sessionLog.forEach(log => {
                        if (log.mode === 'work' && log.ts >= startOfWeek && log.ts < startOfWeek + 7*86400000) {
                            const d = (new Date(log.ts).getDay() + 6) % 7;
                            buckets[d] += log.duration / 60;
                        }
                    });
                    highlightIdx = dayOfWeek;
                    defaultMax = 120; // 周视图最高期望动态值

                } else if (currentChartRange === 'month') {
                    // 月内：1号到月底 (28~31个格子)
                    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
                    buckets = new Array(daysInMonth).fill(0);
                    for(let i=1; i<=daysInMonth; i++) labels.push(i.toString());

                    appData.sessionLog.forEach(log => {
                        if (log.mode === 'work' && log.ts >= startOfMonth && log.ts < startOfMonth + daysInMonth*86400000) {
                            const dateIdx = new Date(log.ts).getDate() - 1;
                            buckets[dateIdx] += log.duration / 60;
                        }
                    });
                    highlightIdx = now.getDate() - 1;
                    defaultMax = 180; 
                }

// 2. 动态自适应Y轴
const dataMax = Math.max(...buckets);
const maxY = Math.max(dataMax, defaultMax);

// 3. 绘制 SVG（使用固定 viewBox，避免展开时左侧空白）
const len = buckets.length;
const vbW = 1000, vbH = 300;          // viewBox 宽高
const padLeft = 60, padRight = 40;    // 左右留白（固定像素，不受宽度影响）
const topY = 30, bottomY = 260;       // 垂直范围
const graphW = vbW - padLeft - padRight; // 实际绘图宽度
const graphH = bottomY - topY;

let pathD = "", areaD = "", pointsHTML = "", labelsHTML = "";

// 有数据时生成折线、区域、节点、数值标签
if (dataMax > 0) {
    buckets.forEach((val, i) => {
        const x = padLeft + (i / (len - 1)) * graphW;
        const y = bottomY - (val / maxY) * graphH;

        if (i === 0) {
            pathD += `M ${x} ${y} `;
            areaD += `M ${x} ${bottomY} L ${x} ${y} `;
        } else {
            pathD += `L ${x} ${y} `;
            areaD += `L ${x} ${y} `;
        }

        const isHigh = (i === highlightIdx);
        pointsHTML += `<circle cx="${x}" cy="${y}" r="4" class="chart-point ${isHigh?'highlight':''}"></circle>`;

        if (val > 0) {
            labelsHTML += `<text x="${x}" y="${y - 8}" class="chart-val-label">${Math.round(val)}</text>`;
        }
    });
    areaD += `L ${vbW - padRight} ${bottomY} Z`;
}

// 横坐标标签（始终显示）
buckets.forEach((val, i) => {
    const x = padLeft + (i / (len - 1)) * graphW;
    const isHigh = (i === highlightIdx);
    let isPrimary = false;
    if (currentChartRange === 'today' && (i === 0 || i === 6 || i === 12 || i === 18 || i === 23)) isPrimary = true;
    if (currentChartRange === 'week') isPrimary = true;
    if (currentChartRange === 'month' && (i === 0 || i === 6 || i === 13 || i === 20 || i === 27 || i === len-1)) isPrimary = true;

    labelsHTML += `<text x="${x}" y="${bottomY + 24}" class="chart-text-label ${isPrimary?'primary':'secondary'} ${isHigh?'highlight':''}">${labels[i]}</text>`;
});

// 坐标轴与刻度
const axisHTML = `
    <line x1="${padLeft}" y1="${bottomY}" x2="${vbW - padRight}" y2="${bottomY}" class="chart-axis" />
    <text x="${padLeft - 8}" y="${bottomY + 5}" class="chart-y-label">0</text>
    <line x1="${padLeft}" y1="${topY + graphH/2}" x2="${vbW - padRight}" y2="${topY + graphH/2}" class="chart-axis" opacity="0.3" />
    <text x="${padLeft - 8}" y="${topY + graphH/2 + 5}" class="chart-y-label">${Math.round(maxY / 2)}${currentChartRange === 'today' ? 'm' : 'h'}</text>
    <line x1="${padLeft}" y1="${topY}" x2="${vbW - padRight}" y2="${topY}" class="chart-axis" opacity="0.3" />
    <text x="${padLeft - 8}" y="${topY + 5}" class="chart-y-label">${Math.round(maxY)}${currentChartRange === 'today' ? 'm' : 'h'}</text>
`;

inner.innerHTML = `
    <svg class="line-chart-svg" viewBox="0 0 ${vbW} ${vbH}" preserveAspectRatio="xMinYMid meet">
        <defs>
            <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--md-sys-color-primary-container)" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="var(--md-sys-color-primary-container)" stop-opacity="0.0"/>
            </linearGradient>
        </defs>
        ${axisHTML}
        ${dataMax > 0 ? `<path d="${areaD}" class="chart-area" />
        <path d="${pathD}" class="chart-line" />
        ${pointsHTML}` : ''}
        ${labelsHTML}
    </svg>
`;
            }

            // ======== 渐进式展开与手势逻辑 ========

        const containerWidth = scrollWrapper.clientWidth;

}
            



            

            

            



            function updateStatsUI() {

                    } catch(e) { console.error("读取存档失败", e); }
                }
                
                document.body.classList.toggle('dark', appData.isDarkTheme);
                requestAnimationFrame(() => {

            function getAudioContext() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
            document.body.addEventListener('pointerdown', function unlockAudio() { const ctx = getAudioContext(); if(ctx.state === 'suspended') ctx.resume(); const buffer = ctx.createBuffer(1, 1, 22050); const source = ctx.createBufferSource(); source.buffer = buffer; source.connect(ctx.destination); source.start(0); document.body.removeEventListener('pointerdown', unlockAudio); }, { once: true });
            function playTone(freq, dur, type='sine') { 
                try { 
                    const ctx = getAudioContext(); 
                    if(ctx.state === 'suspended') ctx.resume().catch(e => {}); 
                    const volScale = appData.settings.volume / 100;
                    if(volScale === 0) return; 
                    const o = ctx.createOscillator(); const g = ctx.createGain(); 
                    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime); 
                    g.gain.setValueAtTime(0.3 * volScale, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur); 
                    o.connect(g); g.connect(ctx.destination); 
                    o.start(ctx.currentTime); o.stop(ctx.currentTime + dur); 
                } catch(e){} 
            }

            function playTickSound() { playTone(600, 0.015, 'triangle'); vibrate([8]); }
            function playStartSound() { const dur = 0.2; playTone(880.00, dur); setTimeout(() => playTone(1108.73, dur), 100); }
            function playPauseSound() { const dur = 0.2; playTone(1108.73, dur); setTimeout(() => playTone(880.00, dur), 100); }
            function playCompletionSound() {
                const d = 153;
                playTone(523.25, 40/d);
                setTimeout(() => playTone(659.25, 20/d), 40/d * 1000);
                setTimeout(() => playTone(783.99, 40/d), (40+20)/d * 1000);
                setTimeout(() => playTone(1046.50, 20/d), (40+20+40)/d * 1000);
            }
            function playResetSound() { const dur = 0.2; playTone(1318.51, dur); playTone(698.46, dur); setTimeout(() => { playTone(1174.66, dur); playTone(698.46, dur); }, 100); setTimeout(() => { playTone(1567.98, dur); playTone(698.46, dur); }, 200); }
            
            function vibrate(p) { 
                if(!navigator.vibrate || appData.settings.vibrate == 0) return; 
                const scale = appData.settings.vibrate / 100;
                if (Array.isArray(p)) { navigator.vibrate(p.map(v => Math.round(v * scale))); } else { navigator.vibrate(Math.round(p * scale)); }
            }

            function vibrateTap() { vibrate([8, 20]); }              
            function vibrateConfirm() { vibrate([15, 30]); }         
            function vibrateCancel() { vibrate([12]); }              
            function vibrateReset() { vibrate([18, 25]); }           
            function vibrateSkip() { vibrate([18, 25, 18]); }        
            function vibrateLongPress() { vibrate([12, 18, 12, 18]); } 
            function vibrateWarning() { vibrate([10]); }             
            function vibrateTest() { vibrate([10, 15, 10]); }        
            function vibrateComplete() { vibrate([80, 70, 80, 70, 180]); }

            async function requestWakeLock() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (err) {} }
            function releaseWakeLock() { if (wakeLock !== null) { wakeLock.release().then(() => wakeLock = null); } }

            function showToast(m) { if(toastTimeout) clearTimeout(toastTimeout); toast.textContent=m; toast.classList.add('show'); toastTimeout=setTimeout(()=>toast.classList.remove('show'),2200); }
            function formatTime(s) { const m=Math.floor(s/60), sec=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

            function updateDisplay() {
                const formattedTime = formatTime(remainingSeconds);
                if (timeDisplay.style.display !== 'none') { timeDisplay.textContent = formattedTime; }
                document.title = `${formattedTime} · ${getT()[currentMode]} - ${getT().title}`;

                const progress = 1 - (remainingSeconds/totalSeconds);
                const offset = (1-progress)*CIRCUMFERENCE;
                progressCircle.style.strokeDashoffset = offset;
                
                const delta = Math.abs(prevRemaining - remainingSeconds);
                const tailLen = Math.min(80, Math.max(20, 30+delta*8));
                progressTail.setAttribute('stroke-dasharray', `${tailLen} ${CIRCUMFERENCE}`);
                progressTail.setAttribute('stroke-dashoffset', offset);
                prevRemaining = remainingSeconds;

                const frac = remainingSeconds/totalSeconds;
                progressCircle.classList.remove('warning','urgent'); timeDisplay.classList.remove('warning','urgent');
                if(isRunning && frac<0.1 && remainingSeconds>0) { progressCircle.classList.add('urgent'); timeDisplay.classList.add('urgent'); }
                else if(isRunning && frac<0.25 && remainingSeconds>0) { progressCircle.classList.add('warning'); timeDisplay.classList.add('warning'); }

                if(isRunning && remainingSeconds<=30 && remainingSeconds>0) {
                    const s = Math.floor(remainingSeconds);
                    if(s !== lastSecondVibrate) { vibrateWarning(); lastSecondVibrate = s; }
                } else lastSecondVibrate = -1;
            }

            function updateFabState() { 
                const isPristine = (remainingSeconds === totalSeconds && !isRunning);
                controlsCard.classList.toggle('pristine', isPristine);
                timeDisplay.classList.toggle('editable', isPristine);

                if(isRunning) { 
                    fabPlay.classList.add('running'); controlsCard.classList.add('running');
                    playIcon.style.display='none'; pauseIcon.style.display='block'; 
                } else { 
                    fabPlay.classList.remove('running'); controlsCard.classList.remove('running');
                    playIcon.style.display='block'; pauseIcon.style.display='none'; 
                } 
            }
            
            function updateIndicatorPosition() {
                const activeBtn = document.querySelector('.mode-card.active');
                const container = document.getElementById('modeCards');
                if (!activeBtn || !container) return;
                const containerRect = container.getBoundingClientRect();
                const btnRect = activeBtn.getBoundingClientRect();
                const leftOffset = btnRect.left - containerRect.left;
                modeIndicator.style.width = `${btnRect.width}px`;
                modeIndicator.style.transform = `translateX(${leftOffset}px)`;
            }

            function updateModeCards() { 
                modeCards.forEach(c=>{ 
                    c.classList.remove('active'); 
                    if(c.dataset.mode===currentMode) c.classList.add('active'); 
                    c.classList.toggle('disabled',isRunning); 
                }); 
                updateIndicatorPosition();
            }
            
            function refreshUI() {
                updateDisplay(); 
                timeLabel.textContent = getT()[currentMode];
                updateFabState(); 
                updateModeCards();
                progressContainer.classList.toggle('running', isRunning);
            }

            function clearTimer() { if(rAF_id) { cancelAnimationFrame(rAF_id); rAF_id = null; } }
            
            function tick() { 
                if(!isRunning) return; 
                const now = Date.now(); 
                remainingSeconds = Math.max(0, totalSeconds - (elapsedBeforePause + (now - startTimestamp)/1000)); 
                updateDisplay(); 
                
                if(remainingSeconds <= 0) completeTimer(); 
                else rAF_id = requestAnimationFrame(tick); 
            }

            function startTimer() { 
                if(isRunning) return; 
                autoStartNext = false;
                const ctx = getAudioContext();
                if(ctx.state === 'suspended') ctx.resume();
                if(remainingSeconds <= 0) { remainingSeconds = totalSeconds; updateDisplay(); } 
                requestWakeLock(); 
                isRunning = true; 
                startTimestamp = Date.now(); 
                rAF_id = requestAnimationFrame(tick); 
                playStartSound(); vibrateConfirm(); refreshUI(); 
            }

            function pauseTimer() { 
                if(!isRunning) return; 
                autoStartNext = false;
                elapsedBeforePause += (Date.now()-startTimestamp)/1000; 
                remainingSeconds = Math.max(0, totalSeconds-elapsedBeforePause); 
                isRunning = false; 
                startTimestamp = null; 
                clearTimer(); 
                releaseWakeLock(); 
                playPauseSound(); 
                updateDisplay(); refreshUI(); 
            }

            function resetTimer() { 
                autoStartNext = false;
                isRunning = false; 
                clearTimer(); 
                releaseWakeLock();
                startTimestamp = null; elapsedBeforePause = 0; remainingSeconds = totalSeconds; 
                playResetSound(); 
                progressCircle.classList.remove('warning','urgent'); timeDisplay.classList.remove('warning','urgent'); 
                timeDisplay.style.fontVariationSettings = `"wght" 700, "wdth" 100`;
                refreshUI(); 
            }

            function completeTimer(isSkip = false) {
                autoStartNext = true;
                isRunning = false; clearTimer(); startTimestamp = null; elapsedBeforePause = 0; remainingSeconds = 0; 
                releaseWakeLock(); updateDisplay();
                progressCircle.classList.remove('warning','urgent'); timeDisplay.classList.remove('warning','urgent');
                timeDisplay.style.fontVariationSettings = `"wght" 700, "wdth" 100`;
                progressContainer.classList.add('completed-anim'); setTimeout(()=>progressContainer.classList.remove('completed-anim'),1500);
                
                playCompletionSound();
                if (!isSkip) {
                    vibrateComplete();
                    if (Notification.permission === 'granted') {
                        const t = getT();
                        new Notification(t.title, { body: currentMode === 'work' ? t.toastWorkDone : t.toastBreakDone, icon: './icon.png', silent: true });
                    }
                    
                    appData.history[currentMode].count += 1;
                    appData.history[currentMode].seconds += totalSeconds;
                    
                    // 新系统：打入底层数据流
                    if(!appData.sessionLog) appData.sessionLog = [];
                    appData.sessionLog.push({
                        ts: Date.now(),
                        mode: currentMode,
                        duration: totalSeconds
                    });
                    
                    // 自动清理超过 60 天的数据，避免存储过大
                    const sixtyDaysAgo = Date.now() - 60 * 24 * 3600 * 1000;
                    appData.sessionLog = appData.sessionLog.filter(log => log.ts > sixtyDaysAgo);
                    
                    saveData();
                    updateStatsUI(); 
                    if(document.getElementById('statsSheet').classList.contains('active')) {
                        renderLineChart(); // 若面板开着，实时更新折线图
                    }
                }
                
                const t = getT();
                if(currentMode === 'work') { 
                    cycleCount++; showToast(t.toastWorkDone); 
                    if(cycleCount >= MAX_SESSIONS) { switchMode('longBreak'); } else { switchMode('shortBreak'); }
                } else { 
                    showToast(t.toastBreakDone); switchMode('work');
                }
                setTimeout(()=>{ if(!isRunning && autoStartNext && remainingSeconds === totalSeconds) { startTimer(); } }, 1600);
                refreshUI();
            }

            function switchMode(mode) { 
                if(isRunning) return; 
                currentMode = mode; 
                if (mode === 'work') { cycleCount = 0; }
                totalSeconds = appData.durations[mode]; 
                remainingSeconds = totalSeconds; elapsedBeforePause = 0; clearTimer(); updateDisplay(); refreshUI(); 
            }
            
            function skipCurrent() { 
                if(isRunning) { isRunning = false; clearTimer(); releaseWakeLock(); startTimestamp = null; }
                autoStartNext = false;
                remainingSeconds = 0; totalSeconds = appData.durations[currentMode]; elapsedBeforePause = totalSeconds; 
                updateDisplay(); completeTimer(true); 
            }
            
            function adjustDuration(deltaSecs) { 
                if(isRunning) return; 
                autoStartNext = false;
                const isPristine = (remainingSeconds === totalSeconds && !isRunning);
                if(!isPristine) return;
                
                let newSecs = appData.durations[currentMode] + deltaSecs; 
                newSecs = Math.max(1, Math.min(120 * 60, newSecs));
                
                if (appData.durations[currentMode] !== newSecs) { playTickSound(); }

                appData.durations[currentMode] = newSecs; 
                totalSeconds = appData.durations[currentMode]; remainingSeconds = totalSeconds; elapsedBeforePause = 0; 
                updateDisplay(); saveData(); 
            }

            function toggleTheme() { 
                appData.isDarkTheme = !appData.isDarkTheme; 
                document.body.classList.toggle('dark', appData.isDarkTheme);
                saveData();
            }

            function applyAnimSpeed() {
                const duration = 2.5 - (appData.settings.anim / 100) * 2.3; 
                document.documentElement.style.setProperty('--anim-speed', `${duration.toFixed(2)}s`);
            }

            function updateVolumeIcon(val) {
                volLow.style.opacity = val > 0 ? '1' : '0';
                volHigh.style.opacity = val > 50 ? '1' : '0';
            }

            function handleSettingsChange(e) {
                const id = e.target.id; const val = parseInt(e.target.value);
                if (id === 'vibrateSlider') { appData.settings.vibrate = val; if(navigator.vibrate) navigator.vibrate(Math.max(1, Math.floor(val/10))); }
                if (id === 'animSlider') { appData.settings.anim = val; applyAnimSpeed(); }
                if (id === 'volumeSlider') { appData.settings.volume = val; updateVolumeIcon(val); if(val > 0) playTone(400 + val*4, 0.05); }
                saveData();
            }

            function parseTimeString(str) {
                str = str.replace(/\D/g, ''); if(!str) return -1;
                let val = parseInt(str, 10); if(val === 0) return 0;
                let strVal = val.toString(); let sec = 0, min = 0;
                if(strVal.length <= 2) { sec = parseInt(strVal, 10); } else { sec = parseInt(strVal.slice(-2), 10); min = parseInt(strVal.slice(0, -2), 10); }
                if(sec > 59) { min += Math.floor(sec / 60); sec = sec % 60; }
                if(min > 120) { min = 120; sec = 0; }
                return min * 60 + sec;
            }

            timeDisplay.addEventListener('click', () => {
                const isPristine = (remainingSeconds === totalSeconds && !isRunning);
                if (!isPristine) return; 
                if (document.getElementById('timeInput')) return; 

                vibrateTap(); 
                const currentSecs = appData.durations[currentMode];
                const input = document.createElement('input');
                input.type = 'tel'; input.id = 'timeInput';
                let m = Math.floor(currentSecs / 60); let s = Math.floor(currentSecs % 60);
                input.value = String(m).padStart(2, '0') + String(s).padStart(2, '0');
                input.className = 'time-display-input'; 
                
                timeDisplay.style.display = 'none';
                timeDisplay.parentNode.insertBefore(input, timeDisplay);
                
                input.focus(); 
                let len = input.value.length; input.setSelectionRange(len, len);

                const finishEdit = () => {
                    let parsedSecs = parseTimeString(input.value);
                    if (parsedSecs === -1) parsedSecs = currentSecs;
                    if (parsedSecs < 1) parsedSecs = 60;

                    if (parsedSecs !== currentSecs) {
                        appData.durations[currentMode] = parsedSecs;
                        totalSeconds = parsedSecs; remainingSeconds = totalSeconds; elapsedBeforePause = 0;
                        saveData(); playTickSound(); 
                    }
                    input.remove(); timeDisplay.style.display = '';
                    updateDisplay(); updateFabState();
                };

                input.addEventListener('blur', finishEdit);
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
            });

            langBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const newLangIdx = parseInt(e.target.dataset.lang);
                    const oldLangIdx = appData.settings.lang;
                    if(oldLangIdx !== newLangIdx) {
                        const direction = newLangIdx > oldLangIdx ? 'left' : 'right';
                        appData.settings.lang = newLangIdx;
                        applyLanguage(direction); vibrateConfirm(); saveData();
                    }
                });
            });

            [vibrateSlider, animSlider, volumeSlider].forEach(slider => {
                slider.addEventListener('input', handleSettingsChange);
                slider.addEventListener('change', () => { if(slider.id === 'vibrateSlider') vibrateTest(); });
            });

            function createRipple(e) {
                const btn = e.currentTarget; const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2; const y = e.clientY - rect.top - size / 2;
                const ripple = document.createElement('span');
                ripple.className = 'ripple'; ripple.style.width = ripple.style.height = `${size}px`; ripple.style.left = `${x}px`; ripple.style.top = `${y}px`;
                btn.appendChild(ripple); ripple.addEventListener('animationend', () => { ripple.remove(); });
            }

            document.querySelectorAll('.adjust-btn, .btn-filled, .fab-primary, .icon-btn, .session-card-btn').forEach(el => {
                el.addEventListener('pointerdown', createRipple);
            });
            
            fabPlay.addEventListener('pointerdown',()=>{ fabPlay.classList.add('bounce'); fabPlay.addEventListener('animationend',()=>fabPlay.classList.remove('bounce'),{once:true}); });
            
            settingsToggle.addEventListener('click',()=>{ 
                settingsOverlay.classList.add('active'); 
                bottomSheet.classList.add('active'); 
                requestAnimationFrame(updateLangIndicator);
            });
            settingsOverlay.addEventListener('click',()=>{ settingsOverlay.classList.remove('active'); bottomSheet.classList.remove('active'); });
            
            function updateStatsTimeIndicator() {
                const activeBtn = document.querySelector('.stats-time-segment .lang-btn.active');
                const indicator = document.getElementById('statsTimeIndicator');
                if (!activeBtn || !indicator) return;
                indicator.style.width = `${activeBtn.offsetWidth}px`;
                indicator.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
            }

            const statsTimeBtns = Array.from(document.querySelectorAll('.stats-time-segment .lang-btn'));
            statsTimeBtns.forEach((btn, index) => {
                btn.addEventListener('click', (e) => {
                    if (e.target.classList.contains('active')) return; 
                    
                    const currentIndex = statsTimeBtns.findIndex(b => b.classList.contains('active'));
                    const direction = index > currentIndex ? 'left' : 'right';
                    
                    statsTimeBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    updateStatsTimeIndicator();
                    vibrateTap();

              // 更新全局状态并控制卡片的宽度类
currentChartRange = e.target.dataset.range;
chartCard.className = `stat-card line-chart-card range-${currentChartRange} ${isExpanded ? 'expanded' : ''}`;
if (isExpanded) {
    const innerChartEl = document.getElementById('chartInner');
    if (innerChartEl && scrollWrapper) {
        let ptCount;
        if (currentChartRange === 'today') ptCount = 24;
        else if (currentChartRange === 'week') ptCount = 7;
        else {
            const now = new Date();
            ptCount = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        }
        innerChartEl.style.width = Math.max(ptCount * 40, scrollWrapper.clientWidth) + 'px';
    }
}
                    
                    
                    // 动画处理：平滑滑出再滑入
                    const innerChart = document.getElementById('chartInner');
                    const titleEl = document.getElementById('lineChartTitle');
                    const outClass = direction === 'left' ? 'slide-out-left' : 'slide-out-right';
                    const inClass = direction === 'left' ? 'slide-in-right' : 'slide-in-left';
                    
                    innerChart.classList.add(outClass);
                    titleEl.classList.add(outClass);
                    
                    setTimeout(() => {
                        renderLineChart(); // 重绘新周期的图表
                        
                        innerChart.classList.remove(outClass);
                        innerChart.classList.add(inClass);
                        titleEl.classList.remove(outClass);
                        titleEl.classList.add(inClass);
                        
                        setTimeout(() => {
                            innerChart.classList.remove(inClass);
                            titleEl.classList.remove(inClass);
                        }, 350);
                    }, 200);
                });
            });
// 点击图表卡片本身 展开
chartCard.addEventListener('click', (e) => {
    if (!isExpanded) {
        expandChart();
    }
});

// 点击右上角 X 图标 折叠（阻止冒泡，防止触发上面卡片点击）
keepExpandedZone.addEventListener('click', (e) => {
    e.stopPropagation();
    collapseChart();
});
            statsEntryBtn.addEventListener('click',()=>{ 
                statsOverlay.classList.add('active'); 
                statsSheet.classList.add('active'); 
                updateStatsUI(); 
                renderLineChart(); 
                requestAnimationFrame(updateStatsTimeIndicator);
            });
            statsOverlay.addEventListener('click',()=>{ 
                statsOverlay.classList.remove('active'); 
                statsSheet.classList.remove('active');
                // 面板关闭时，将折线图状态还原回折叠状态
                if(isExpanded) collapseChart();
            });

            const updateBtn = document.getElementById('updateBtn');
            if(updateBtn) {
                updateBtn.addEventListener('click', () => { vibrateConfirm(); if (newWorker) newWorker.postMessage({ type: 'SKIP_WAITING' }); });
            }

            fabPlay.addEventListener('click',()=>{ 
                if (Notification.permission === 'default') Notification.requestPermission();
                if(isRunning){ pauseTimer(); vibrateCancel(); } else startTimer(); 
            });
            resetBtn.addEventListener('click',()=>{ resetTimer(); vibrateReset(); });
            skipBtn.addEventListener('click',()=>{ skipCurrent(); vibrateSkip(); });
            
            modeCards.forEach(card=>{ 
                card.addEventListener('click',()=>{ 
                    if(isRunning) return; 
                    const mode=card.dataset.mode; 
                    if(mode && mode !== currentMode){ autoStartNext = false; vibrateTap(); switchMode(mode); } 
                }); 
            });
            
            adjustMinusBtn.addEventListener('click',()=>{ adjustDuration(-60); });
            adjustPlusBtn.addEventListener('click',()=>{ adjustDuration(60); });
            
            let longPressTimeout = null; let longPressInterval = null;
            function setupLongPress(btn, delta) { 
                btn.addEventListener('pointerdown', () => { longPressTimeout = setTimeout(() => { vibrateLongPress(); longPressInterval = setInterval(() => { adjustDuration(delta); }, 120); }, 400); }); 
                const clear = () => { if (longPressTimeout) { clearTimeout(longPressTimeout); longPressTimeout = null; } if (longPressInterval) { clearInterval(longPressInterval); longPressInterval = null; } }; 
                btn.addEventListener('pointerup', clear); btn.addEventListener('pointerleave', clear); btn.addEventListener('pointercancel', clear); 
            }
            setupLongPress(adjustMinusBtn, -60); setupLongPress(adjustPlusBtn, 60);
            
            themeToggle.addEventListener('click',()=>{ toggleTheme(); vibrateTap(); });
            
            document.addEventListener('keydown',(e)=>{ if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); isRunning?pauseTimer():startTimer(); isRunning?vibrateCancel():vibrateConfirm(); } else if(e.code==='KeyR'&&e.target===document.body){ e.preventDefault(); resetTimer(); vibrateReset(); } });
            document.addEventListener('visibilitychange',()=>{ if(!document.hidden && isRunning && wakeLock === null) requestWakeLock(); });
            window.addEventListener('resize', () => { updateIndicatorPosition(); updateLangIndicator(); updateStatsTimeIndicator(); renderLineChart(); });

            progressCircle.style.strokeDasharray = CIRCUMFERENCE; progressCircle.style.strokeDashoffset = CIRCUMFERENCE;
            progressTail.setAttribute('stroke-dasharray', `30 ${CIRCUMFERENCE}`); progressTail.setAttribute('stroke-dashoffset', CIRCUMFERENCE);
            
            loadData();
        })();
    </script>
</body>
</html>
